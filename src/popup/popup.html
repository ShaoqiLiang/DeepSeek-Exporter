<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #333;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      text-align: center;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header p { font-size: 12px; opacity: 0.85; margin-top: 4px; }

    .content { padding: 16px; }

    /* 对话列表 */
    .conversation-list { margin-bottom: 16px; }
    .conversation-list h3 {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .conversation-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: white;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .conversation-item:hover {
      border-color: #667eea;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
    }
    .conversation-item.selected {
      border-color: #667eea;
      background: #f5f5ff;
    }
    .conversation-item .title {
      flex: 1;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conversation-item .count {
      font-size: 11px;
      color: #888;
      margin-left: 8px;
    }

    /* 选项 */
    .options {
      background: white;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .option-row {
      display: flex;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
    }
    .option-row input[type="checkbox"] {
      accent-color: #667eea;
      width: 16px;
      height: 16px;
      margin-right: 8px;
    }

    /* 导出按钮 */
    .export-buttons {
      display: flex;
      gap: 8px;
    }
    .export-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      transition: all 0.15s;
    }
    .export-btn:hover {
      border-color: #667eea;
      background: #f5f5ff;
      color: #667eea;
    }
    .export-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: #888;
      font-size: 13px;
    }
    .empty-state .icon { font-size: 32px; margin-bottom: 8px; }

    /* 状态消息 */
    .status {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 12px;
      min-height: 18px;
    }
    .status.error { color: #f44336; }
    .status.success { color: #4caf50; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📤 DeepSeek 对话导出</h1>
    <p>一键导出完整多轮问答</p>
  </div>

  <div class="content">
    <div class="conversation-list">
      <h3>已捕获的对话</h3>
      <div id="conv-list"></div>
    </div>

    <div class="options">
      <label class="option-row">
        <input type="checkbox" id="opt-thinking" checked>
        🧠 包含思考过程
      </label>
      <label class="option-row">
        <input type="checkbox" id="opt-search" checked>
        🔍 包含搜索结果
      </label>
    </div>

    <div class="export-buttons">
      <button class="export-btn" data-format="markdown" id="btn-md">📝 MD</button>
      <button class="export-btn" data-format="json" id="btn-json">📋 JSON</button>
      <button class="export-btn" data-format="html" id="btn-html">🌐 HTML</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
